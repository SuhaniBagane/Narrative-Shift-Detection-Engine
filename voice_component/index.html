<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Voice Assistant</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
    }
    .mic-btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 10px 18px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      width: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .mic-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.8);
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 20px #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e2e8f0;
      gap: 6px;
      padding: 2px 5px;
    }
    .status-text {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="mic-btn" id="micBtn">
      <span style="font-size: 1.2rem; margin-right: 6px;">🎙️</span>
      <span id="btnLabel">Click to Speak</span>
    </button>
    <div class="status-text" id="status">Voice Standby</div>
  </div>

  <script>
    // Streamlit Component SDK messaging helper
    function sendValueToStreamlit(value) {
      const message = {
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
      };
      window.parent.postMessage(message, "*");
    }

    // Setup Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const SpeechSynthesis = window.speechSynthesis;
    
    const micBtn = document.getElementById('micBtn');
    const btnLabel = document.getElementById('btnLabel');
    const status = document.getElementById('status');
    let isListening = false;
    let recognition = null;

    if (!SpeechRecognition) {
      status.innerText = "Unsupported Browser";
      btnLabel.innerText = "Mic Unavailable";
      micBtn.disabled = true;
      micBtn.style.opacity = "0.5";
      micBtn.style.cursor = "not-allowed";
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch(e) {
            console.error("Start failed:", e);
          }
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        btnLabel.innerText = "Listening...";
        status.innerText = "Listening...";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        btnLabel.innerText = "Click to Speak";
        if (status.innerText === "Listening...") {
          status.innerText = "Voice Standby";
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        status.innerText = "Retry Voice";
        btnLabel.innerText = "Click to Speak";
        isListening = false;
        micBtn.classList.remove('listening');
      };


      recognition.onresult = (event) => {
        const resultText = event.results[0][0].transcript;
        status.innerText = "Heard: " + resultText;
        sendValueToStreamlit(resultText);
      };
    }

    // Tab switching helper
    function clickTabByName(tabName) {
      try {
        const parentDoc = window.parent.document;
        const tabs = parentDoc.querySelectorAll('button[role="tab"], button[data-baseweb="tab"]');
        for (let tab of tabs) {
          if (tab.textContent.toLowerCase().includes(tabName.toLowerCase())) {
            tab.click();
            return true;
          }
        }
      } catch(e) {
        console.error("Failed to click tab:", e);
      }
      return false;
    }

    function setFrameHeight(h) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: h || 95
      }, "*");
    }

    // Listen to messages from Streamlit python backend
    window.addEventListener("message", (event) => {
      // Check for render events
      if (event.data && event.data.type === "streamlit:render") {
        setFrameHeight(95);
        const args = event.data.args;
        if (args) {
          if (args.text_to_speak) {
            const text = args.text_to_speak;
            if (SpeechSynthesis && !SpeechSynthesis.speaking) {
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.rate = 1.0;
              utterance.pitch = 1.0;
              
              const originalStatusText = status.innerText;
              status.innerText = "Speaking...";
              
              utterance.onend = () => {
                status.innerText = "Voice Standby";
                setFrameHeight(95);
              };
              
              SpeechSynthesis.cancel();
              SpeechSynthesis.speak(utterance);
            }
          }
          if (args.active_tab_to_click) {
            setTimeout(() => {
              clickTabByName(args.active_tab_to_click);
            }, 150);
          }
        }
      }
    });

    // Notify Streamlit that the component is loaded and ready
    const readyMessage = {
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    };
    window.parent.postMessage(readyMessage, "*");
    setFrameHeight(95);
  </script>
</body>
</html>
